<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Barbearia Carmo — Agende seu horário</title>
<meta name="description" content="Barbearia Carmo, desde 2021: agende corte, barba e desenho, veja nossos trabalhos e os produtos do shop.">
<meta name="theme-color" content="#09090b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carmo">
<meta property="og:title" content="Barbearia Carmo">
<meta property="og:description" content="Agende seu horário: fade, social, barba, desenho e corte infantil.">
<meta property="og:image" content="https://gustavombarbosadev.github.io/BarbeariaCarmo/img/logo-600.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/client.css">
<link rel="stylesheet" href="css/owner.css">
<link rel="stylesheet" href="css/overlays.css">
<link rel="stylesheet" href="css/motion.css">
<link rel="stylesheet" href="css/intro.css">
</head>
<body>
<div id="boot" class="intro-carmo" role="dialog" aria-modal="true" aria-labelledby="intro-title">
  <div class="intro-textura" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="intro-luz intro-luz-a" aria-hidden="true"></div>
  <div class="intro-luz intro-luz-b" aria-hidden="true"></div>
  <button class="intro-pular" id="intro-pular" type="button">Pular abertura <span aria-hidden="true">↗</span></button>
  <div class="intro-conteudo">
    <div class="intro-emblema"><span class="intro-aro intro-aro-a"></span><span class="intro-aro intro-aro-b"></span><img src="img/logo-320.png" alt="Barbearia Carmo" width="320" height="320"></div>
    <p class="intro-kicker"><span></span> BARBEARIA CARMO <i>•</i> DESDE 2021</p>
    <h1 id="intro-title">Seu estilo.<br><em>Nossa assinatura.</em></h1>
    <p class="intro-descricao">Precisão no corte. Personalidade em cada detalhe.</p>
    <button class="intro-entrar" id="intro-entrar" type="button">Entrar na barbearia <span aria-hidden="true">↗</span></button>
  </div>
  <div class="intro-rodape" aria-hidden="true"><span>BARBEARIA CARMO</span><i></i><span>DESDE 2021</span></div>
</div>
<div id="app"></div>
<noscript><p class="no-script-notice">Ative o JavaScript para usar o app da Barbearia Carmo.</p></noscript>
<script>
(function () {
  var boot = document.getElementById("boot");
  var inicio = performance.now();
  var chave = "bc.intro.v2";
  var forcar = new URLSearchParams(location.search).get("intro") === "1";
  var reduzido = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var primeira = forcar;
  try {
    primeira = primeira || !sessionStorage.getItem(chave);
    if (primeira) sessionStorage.setItem(chave, "1");
  } catch (_) { primeira = true; }
  var duracao = primeira && !reduzido ? 2600 : 0;
  var encerrando = false;
  window.encerrarAbertura = function (pular) {
    if (encerrando || !boot || !boot.isConnected) return;
    encerrando = true;
    var espera = pular ? 0 : Math.max(0, duracao - (performance.now() - inicio));
    window.setTimeout(function () {
      if (!boot.isConnected) return;
      boot.classList.add("sai");
      boot.setAttribute("aria-hidden", "true");
      boot.removeAttribute("aria-modal");
      window.setTimeout(function () { boot.remove(); }, 720);
    }, espera);
  };
  document.getElementById("intro-entrar").addEventListener("click", function () { window.encerrarAbertura(true); });
  document.getElementById("intro-pular").addEventListener("click", function () { window.encerrarAbertura(true); });
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && boot.isConnected) window.encerrarAbertura(true);
  });
  if (primeira) document.getElementById("intro-entrar").focus({ preventScroll: true });
  else window.encerrarAbertura(true);
  window.setTimeout(function () { window.encerrarAbertura(true); }, 8000);
})();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(function () {}); });
}
</script>
<script src="firebase-config.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
